name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Check the sample data is reproducible
        run: |
          python scripts/generate_sample_data.py
          git diff --exit-code -- data/

      - name: Rebuild the published site
        run: python scripts/build_site.py

      - name: Exercise the command line interface
        run: |
          fundreg --version
          fundreg ucits data/sample_portfolio.csv || test $? -eq 1
          fundreg priips data/returns/meridian_european_equity.csv --rhp 5
          fundreg eet data/sample_eet.csv || test $? -eq 1
          fundreg emt data/sample_emt.csv || test $? -eq 1
          fundreg reconcile data/sample_eet.csv data/sample_emt.csv || test $? -eq 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .
