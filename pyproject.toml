[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-regdata-toolkit"
version = "0.1.0"
description = "UCITS limits, PRIIPs KID calculations and EET/EMT validation for European funds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "ucits", "priips", "mifid", "aifmd", "sfdr", "eet", "emt",
    "asset-management", "regtech", "fund-compliance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
fundreg = "fundreg.cli:main"

[project.urls]
Homepage = "https://github.com/gitshiven/Fund-regdata-toolkit"
Documentation = "https://gitshiven.github.io/Fund-regdata-toolkit/"
Issues = "https://github.com/gitshiven/Fund-regdata-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fundreg = ["templates/specs/*.json"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py310"
# Ruff reformats Python code blocks inside Markdown. The README wraps its
# examples deliberately for reading width, so leave documentation alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
